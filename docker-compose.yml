services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_observatory
      POSTGRES_USER: agent_observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_observatory -d agent_observatory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
